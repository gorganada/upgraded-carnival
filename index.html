<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Çanakkale 1915</title>
<style>
  :root { --bg:#06070b; --fg:#f4efe6; --red:#e30a17; color-scheme:dark; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow:hidden; }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  canvas { display:block; background:#000; box-shadow:0 0 60px rgba(0,0,0,.8); }
  .overlay { position:fixed; inset:0; display:flex; flex-direction:column; gap:18px;
    align-items:center; justify-content:center; background:radial-gradient(circle at 50% 40%, rgba(120,10,15,.55), rgba(0,0,0,.92));
    text-align:center; padding:16px; transition:opacity .4s; }
  .overlay.hidden { opacity:0; pointer-events:none; }
  .overlay h1 { margin:0; font-family: Georgia, "Times New Roman", serif; font-size:clamp(36px,8vw,84px); letter-spacing:.06em; }
  .overlay h1 span { color:var(--red); }
  .overlay p { margin:0; opacity:.8; font-size:clamp(14px,2.4vw,18px); max-width:560px; }
  button { font:inherit; cursor:pointer; border:0; border-radius:999px; }
  .play { background:var(--red); color:#fff; font-size:20px; font-weight:700; padding:14px 34px;
    box-shadow:0 8px 30px rgba(227,10,23,.45); }
  .play:hover { transform:scale(1.04); }
  #mute { position:fixed; top:12px; right:12px; background:rgba(0,0,0,.45); color:#fff; padding:8px 12px; font-size:16px; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<button id="mute" title="Ses">🔊</button>
<div class="overlay" id="start">
  <h1>ÇANAKKALE <span>1915</span></h1>
  <p>Çöp adamlarla 20 saniyede Çanakkale Savaşı — Nusret'ten 18 Mart'a, kara çıkarmasından "Çanakkale geçilmez"e.</p>
  <button class="play" id="playBtn">▶ İzle</button>
</div>
<div class="overlay hidden" id="end">
  <h1>ÇANAKKALE <span>GEÇİLMEZ</span></h1>
  <button class="play" id="replayBtn">↻ Tekrar İzle</button>
</div>
<script>
(() => {
const W = 1280, H = 720, END = 21.5;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let scale = 1;
function resize() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  let w = innerWidth, h = w * 9 / 16;
  if (h > innerHeight) { h = innerHeight; w = h * 16 / 9; }
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  scale = cv.width / W;
}
addEventListener('resize', resize); resize();

// ---------- utils ----------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let R = mulberry32(1915);
const sR = mulberry32(42);
const STARS = Array.from({ length: 140 }, () => ({ x: sR() * W, y: sR() * 430, r: sR() * 1.4 + .3, tw: sR() * 6 }));
function fade(T, a, b, f = .35) { return clamp((T - a) / f) * clamp((b - T) / f); }

// ---------- audio ----------
let ac = null, master = null, noiseBuf = null, muted = false, silent = false;
function initAudio() {
  if (ac) { ac.resume(); return; }
  try {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain(); master.gain.value = .8; master.connect(ac.destination);
    const len = ac.sampleRate * 3; noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { ac = null; }
}
const canPlay = () => ac && !muted && !silent;
function boom(p = 1) {
  if (!canPlay()) return; const t = ac.currentTime;
  const src = ac.createBufferSource(); src.buffer = noiseBuf;
  const f = ac.createBiquadFilter(); f.type = 'lowpass';
  f.frequency.setValueAtTime(400 + 900 * p, t); f.frequency.exponentialRampToValueAtTime(50, t + 1.4 * p);
  const g = ac.createGain(); g.gain.setValueAtTime(.0001, t);
  g.gain.exponentialRampToValueAtTime(.8 * Math.min(1, p), t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + 1.6 * p);
  src.connect(f); f.connect(g); g.connect(master); src.start(t, Math.random()); src.stop(t + 2);
  const o = ac.createOscillator(); o.frequency.setValueAtTime(95, t); o.frequency.exponentialRampToValueAtTime(28, t + .6);
  const og = ac.createGain(); og.gain.setValueAtTime(.8 * Math.min(1.2, p), t); og.gain.exponentialRampToValueAtTime(.0001, t + .7);
  o.connect(og); og.connect(master); o.start(t); o.stop(t + .8);
}
let lastShot = 0;
function shot(v = .22) {
  if (!canPlay()) return; const t = ac.currentTime; if (t - lastShot < .045) return; lastShot = t;
  const src = ac.createBufferSource(); src.buffer = noiseBuf;
  const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1400 + Math.random() * 900; f.Q.value = .7;
  const g = ac.createGain(); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + .14);
  src.connect(f); f.connect(g); g.connect(master); src.start(t, Math.random() * 2); src.stop(t + .2);
}
function splashSnd() {
  if (!canPlay()) return; const t = ac.currentTime;
  const src = ac.createBufferSource(); src.buffer = noiseBuf;
  const f = ac.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 900;
  const g = ac.createGain(); g.gain.setValueAtTime(.18, t); g.gain.exponentialRampToValueAtTime(.0001, t + .5);
  src.connect(f); f.connect(g); g.connect(master); src.start(t, Math.random() * 2); src.stop(t + .6);
}
function pad() {
  if (!canPlay()) return; const t = ac.currentTime;
  [110, 164.81, 220, 261.63, 329.63].forEach((fr, i) => {
    const o = ac.createOscillator(); o.type = i % 2 ? 'triangle' : 'sine'; o.frequency.value = fr;
    const g = ac.createGain(); g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(.07, t + 1.2); g.gain.setValueAtTime(.07, t + 2.6); g.gain.exponentialRampToValueAtTime(.0001, t + 5);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + 5.2);
  });
}

// ---------- particles / fx ----------
let P = [], tracers = [], shake = 0, flash = 0;
function add(p) { const q = Object.assign({ vx: 0, vy: 0, g: 0, drag: 1, grow: 0, life: 1, size: 4, type: 'smoke', col: '#777' }, p); q.max = q.life; P.push(q); }
function explode(x, y, k = 1, water = false, snd = true) {
  for (let i = 0; i < 16 * k; i++) add({ type: 'fire', x: x + (R() - .5) * 20 * k, y, vx: (R() - .5) * 280 * k, vy: -R() * 260 * k, drag: .15, g: -60, life: .4 + R() * .5, size: 8 + R() * 18 * k, grow: 30 });
  for (let i = 0; i < 12 * k; i++) add({ type: 'smoke', x: x + (R() - .5) * 30 * k, y: y - R() * 20, vx: (R() - .5) * 90, vy: -30 - R() * 70, drag: .4, life: 1.4 + R() * 1.4, size: 12 + R() * 20 * k, grow: 26, col: R() < .5 ? '#3a3a3a' : '#6b6b6b' });
  for (let i = 0; i < 10 * k; i++) add({ type: 'debris', x, y, vx: (R() - .5) * 500 * k, vy: -150 - R() * 400 * k, g: 700, life: 1 + R() * .8, size: 2 + R() * 3, col: '#1d1d1d' });
  if (water) for (let i = 0; i < 26 * k; i++) add({ type: 'water', x: x + (R() - .5) * 40 * k, y, vx: (R() - .5) * 120 * k, vy: -250 - R() * 520 * k, g: 900, life: 1 + R() * .6, size: 3 + R() * 6, col: '#e8f4fb' });
  add({ type: 'flash', x, y, size: 90 * k, life: .22 });
  shake = Math.max(shake, 9 * k); flash = Math.max(flash, .18 * Math.min(k, 1.6));
  if (snd) boom(Math.min(1.3, .45 + k * .35));
}
function splash(x, y, k = 1) {
  for (let i = 0; i < 18 * k; i++) add({ type: 'water', x: x + (R() - .5) * 16, y, vx: (R() - .5) * 140, vy: -180 - R() * 320 * k, g: 900, life: .8 + R() * .5, size: 2 + R() * 4, col: '#e8f4fb' });
  splashSnd();
}
function dust(x, y) { add({ type: 'smoke', x, y, vx: (R() - .5) * 40, vy: -10 - R() * 20, drag: .3, life: .6 + R() * .4, size: 4 + R() * 5, grow: 14, col: '#b9a27a' }); }
function muzzle(x, y) { add({ type: 'fire', x, y, life: .08, size: 7 + R() * 5, grow: 0 }); add({ type: 'smoke', x, y, vx: (R() - .5) * 20, vy: -15, life: .6, size: 4, grow: 14, col: '#cfcfcf' }); }
function tracer(x0, y0, x1, y1) { tracers.push({ x0, y0, x1, y1, life: .12 }); }
function stepFx(dt) {
  for (const p of P) { const d = Math.pow(p.drag, dt); p.vx *= d; p.vy *= d; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.size += p.grow * dt; p.life -= dt; }
  P = P.filter(p => p.life > 0);
  for (const tr of tracers) tr.life -= dt; tracers = tracers.filter(t => t.life > 0);
  shake *= Math.pow(.004, dt); flash *= Math.pow(.01, dt);
}
function drawFx() {
  for (const p of P) {
    const a = clamp(p.life / p.max);
    if (p.type === 'smoke') { ctx.globalAlpha = a * .55; ctx.fillStyle = p.col; circle(p.x, p.y, p.size); }
    else if (p.type === 'water' || p.type === 'debris') { ctx.globalAlpha = p.type === 'water' ? a * .9 : a; ctx.fillStyle = p.col; circle(p.x, p.y, p.size); }
  }
  ctx.globalCompositeOperation = 'lighter';
  for (const p of P) {
    const a = clamp(p.life / p.max);
    if (p.type === 'fire') {
      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
      g.addColorStop(0, `rgba(255,240,180,${a})`); g.addColorStop(.4, `rgba(255,140,30,${a * .8})`); g.addColorStop(1, 'rgba(200,30,0,0)');
      ctx.globalAlpha = 1; ctx.fillStyle = g; circle(p.x, p.y, p.size);
    } else if (p.type === 'flash') {
      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
      g.addColorStop(0, `rgba(255,255,230,${a})`); g.addColorStop(1, 'rgba(255,200,100,0)');
      ctx.globalAlpha = 1; ctx.fillStyle = g; circle(p.x, p.y, p.size);
    }
  }
  ctx.lineWidth = 2;
  for (const t of tracers) { ctx.globalAlpha = clamp(t.life / .12); ctx.strokeStyle = '#ffe9a0';
    const k = 1 - t.life / .12; ctx.beginPath(); ctx.moveTo(lerp(t.x0, t.x1, k * .6), lerp(t.y0, t.y1, k * .6)); ctx.lineTo(lerp(t.x0, t.x1, k * .6 + .4), lerp(t.y0, t.y1, k * .6 + .4)); ctx.stroke(); }
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
}
function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, Math.max(.1, r), 0, Math.PI * 2); ctx.fill(); }

// ---------- drawing helpers ----------
function sky(stops, y1 = H) {
  const g = ctx.createLinearGradient(0, 0, 0, y1); stops.forEach((c, i) => g.addColorStop(i / (stops.length - 1), c));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function stars(a, T) { ctx.fillStyle = '#fff'; for (const s of STARS) { ctx.globalAlpha = a * (.5 + .5 * Math.sin(T * 3 + s.tw)); circle(s.x, s.y, s.r); } ctx.globalAlpha = 1; }
function sun(x, y, r, col, glow) {
  const g = ctx.createRadialGradient(x, y, r * .3, x, y, r * 4); g.addColorStop(0, glow); g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.fillRect(x - r * 4, y - r * 4, r * 8, r * 8); ctx.fillStyle = col; circle(x, y, r);
}
function hills(y, col, seed, amp = 40, step = 80) {
  ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, H); const r = mulberry32(seed);
  for (let x = -step; x <= W + step; x += step) ctx.lineTo(x, y - r() * amp - Math.sin(x * .004 + seed) * amp * .6);
  ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
}
function seaGrad(y0, c1, c2) { const g = ctx.createLinearGradient(0, y0, 0, H); g.addColorStop(0, c1); g.addColorStop(1, c2); return g; }
function sea(y0, yStart, grad, T, waveCol, x0 = 0, x1 = W) {
  ctx.fillStyle = grad; ctx.fillRect(x0, yStart, x1 - x0, H - yStart);
  ctx.strokeStyle = waveCol; ctx.lineWidth = 1.5;
  for (let i = 0; i < 14; i++) {
    const yy = y0 + 6 + i * i * 2.2; if (yy < yStart - 2) continue;
    ctx.globalAlpha = .25 + i * .03; ctx.beginPath();
    for (let x = x0; x <= x1; x += 18) { const w = Math.sin(x * .03 + T * (1.5 + i * .1) + i * 1.7) * (1 + i * .35); x === x0 ? ctx.moveTo(x, yy + w) : ctx.lineTo(x, yy + w); }
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}
function label(txt, x, y, opts = {}) {
  ctx.font = `${opts.bold === false ? '' : '700 '}${opts.size || 16}px system-ui, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const w = ctx.measureText(txt).width + 16, h = (opts.size || 16) + 10;
  ctx.globalAlpha = (opts.a ?? 1);
  ctx.fillStyle = opts.bg || 'rgba(0,0,0,.6)'; roundRect(x - w / 2, y - h / 2, w, h, h / 2); ctx.fill();
  ctx.fillStyle = opts.col || '#fff'; ctx.fillText(txt, x, y + 1); ctx.globalAlpha = 1;
}
function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

// Turkish flag, rendered once flat then drawn in waving slices
const flagCv = document.createElement('canvas'); flagCv.width = 300; flagCv.height = 200;
(() => {
  const c = flagCv.getContext('2d'), G = 200;
  c.fillStyle = '#E30A17'; c.fillRect(0, 0, 300, 200);
  c.fillStyle = '#fff'; c.beginPath(); c.arc(.5 * G, 100, .25 * G, 0, 7); c.fill();
  c.fillStyle = '#E30A17'; c.beginPath(); c.arc(.5625 * G, 100, .2 * G, 0, 7); c.fill();
  c.fillStyle = '#fff'; c.beginPath(); const sx = .5 * G + .333 * G, r1 = .125 * G, r2 = r1 * .382;
  for (let i = 0; i < 10; i++) { const a = Math.PI + i * Math.PI / 5, r = i % 2 ? r2 : r1; c.lineTo(sx + Math.cos(a) * r, 100 + Math.sin(a) * r); }
  c.closePath(); c.fill();
})();
function flag(x, y, w, h, T, amp = 1, pole = true, poleLen = h * 2.4) {
  if (pole) { ctx.strokeStyle = '#3b2a1a'; ctx.lineWidth = Math.max(2, w * .025); ctx.beginPath(); ctx.moveTo(x, y - 4); ctx.lineTo(x, y + poleLen); ctx.stroke(); }
  const N = 30, sw = w / N;
  for (let i = 0; i < N; i++) {
    const k = i / N, off = Math.sin(k * 6 - T * 6) * h * .07 * amp * k, shade = Math.cos(k * 6 - T * 6) * .18 * amp * k;
    ctx.drawImage(flagCv, k * 300, 0, 300 / N + .5, 200, x + i * sw, y + off, sw + .6, h);
    ctx.fillStyle = shade > 0 ? `rgba(255,255,255,${shade})` : `rgba(0,0,0,${-shade})`;
    ctx.fillRect(x + i * sw, y + off, sw + .6, h);
  }
}

// stick figure: feet at (x,y)
function stick(o) {
  const s = o.s || 1, f = o.face || 1, col = o.col || '#151515';
  ctx.save(); ctx.translate(o.x, o.y);
  if (o.fall) ctx.rotate(-f * ease(clamp(o.fall)) * 1.5);
  ctx.scale(s * f, s);
  ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 3.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const ph = o.run, running = ph != null && !o.fall;
  const bob = running ? Math.abs(Math.sin(ph)) * 3 : 0, lean = running ? 7 : 0;
  const hip = [0, -24 - bob], neck = [lean, -46 - bob], head = [lean + 2, -55 - bob];
  const leg = (a, b) => { const kx = hip[0] + Math.sin(a) * 12, ky = hip[1] + Math.cos(a) * 12;
    ctx.beginPath(); ctx.moveTo(...hip); ctx.lineTo(kx, ky); ctx.lineTo(kx + Math.sin(a - b) * 12, ky + Math.cos(a - b) * 12); ctx.stroke(); };
  if (running) { const a = Math.sin(ph) * .8; leg(a, Math.max(0, Math.cos(ph)) * 1.1); leg(-a, Math.max(0, -Math.cos(ph)) * 1.1); }
  else if (o.kneel) { leg(1.3, 2.6); leg(.3, 0); }
  else { leg(.22, 0); leg(-.22, 0); }
  ctx.beginPath(); ctx.moveTo(...hip); ctx.lineTo(...neck); ctx.stroke();
  ctx.beginPath(); ctx.arc(head[0], head[1], 7.5, 0, Math.PI * 2); ctx.fill();
  const sh = [neck[0] - 1, neck[1] + 4];
  if (o.point) {
    ctx.beginPath(); ctx.moveTo(...sh); ctx.lineTo(sh[0] + 13, sh[1] - 8); ctx.lineTo(sh[0] + 25, sh[1] - 16); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(...sh); ctx.lineTo(sh[0] - 4, sh[1] + 11); ctx.lineTo(sh[0] + 2, sh[1] + 20); ctx.stroke();
  } else if (o.lift != null) {
    const ly = lerp(4, -26, o.lift);
    ctx.beginPath(); ctx.moveTo(...sh); ctx.lineTo(sh[0] + 9, sh[1] + ly * .5 + 6); ctx.lineTo(sh[0] + 4, sh[1] + ly); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(...sh); ctx.lineTo(sh[0] - 7, sh[1] + ly * .5 + 6); ctx.lineTo(sh[0] - 4, sh[1] + ly); ctx.stroke();
    ctx.save(); ctx.translate(sh[0], sh[1] + ly - 5); ctx.rotate(Math.PI / 2);
    ctx.fillStyle = '#c9a23c'; ctx.fillRect(-6, -13, 12, 24); ctx.fillStyle = '#7d5f1b'; ctx.beginPath(); ctx.moveTo(-6, -13); ctx.lineTo(0, -22); ctx.lineTo(6, -13); ctx.fill(); ctx.restore();
  } else if (o.flag) {
    ctx.beginPath(); ctx.moveTo(...sh); ctx.lineTo(sh[0] + 9, sh[1] - 6); ctx.lineTo(sh[0] + 10, sh[1] - 18); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(...sh); ctx.lineTo(sh[0] + 6, sh[1] + 10); ctx.lineTo(sh[0] + 12, sh[1] + 8); ctx.stroke();
    ctx.restore();
    // pole + flag drawn unscaled so it doesn't mirror
    const px = o.x + (sh[0] + 10) * s * f, py = o.y + (sh[1] - 50) * s;
    ctx.strokeStyle = '#3b2a1a'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(px, o.y - 4 * s); ctx.lineTo(px, py); ctx.stroke();
    if (f > 0) flag(px, py, 46 * s, 30 * s, o.T || 0, 1.3, false);
    else { ctx.save(); ctx.translate(px, 0); ctx.scale(-1, 1); flag(0, py, 46 * s, 30 * s, o.T || 0, 1.3, false); ctx.restore(); }
    ctx.save(); ctx.translate(o.x, o.y); ctx.scale(s * f, s); ctx.fillStyle = col; ctx.strokeStyle = col;
  } else if (o.gun !== false) {
    const aim = o.aim || 0;
    ctx.save(); ctx.translate(sh[0] + 2, sh[1] + 6); ctx.rotate(aim);
    ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-4, -2); ctx.lineTo(11, 2); ctx.moveTo(-4, -2); ctx.lineTo(4, 6); ctx.stroke();
    ctx.strokeStyle = '#4a3423'; ctx.lineWidth = 3.4; ctx.beginPath(); ctx.moveTo(-8, 5); ctx.lineTo(26, 0); ctx.stroke();
    if (o.bayonet) { ctx.strokeStyle = '#d8d8d8'; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(26, 0); ctx.lineTo(37, -1.5); ctx.stroke(); }
    ctx.restore();
  } else {
    ctx.beginPath(); ctx.moveTo(...sh); ctx.lineTo(sh[0] + 4, sh[1] + 11); ctx.lineTo(sh[0] + 6, sh[1] + 20); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(...sh); ctx.lineTo(sh[0] - 4, sh[1] + 11); ctx.lineTo(sh[0] - 3, sh[1] + 20); ctx.stroke();
  }
  // headgear
  const hx = head[0], hy = head[1];
  if (o.hat === 'kabalak') { ctx.fillStyle = '#8b7a4b'; ctx.beginPath(); ctx.ellipse(hx, hy - 4, 8.5, 6, 0, Math.PI, 0); ctx.fill(); ctx.fillRect(hx - 8.5, hy - 5, 17, 3); }
  else if (o.hat === 'kalpak') { ctx.fillStyle = '#2a211b'; roundRect(hx - 7.5, hy - 15, 15, 11, 3); ctx.fill(); }
  else if (o.hat === 'slouch') { ctx.fillStyle = '#6f6040'; ctx.fillRect(hx - 12, hy - 6, 24, 2.6); ctx.beginPath(); ctx.ellipse(hx, hy - 6, 6.5, 5, 0, Math.PI, 0); ctx.fill(); ctx.fillRect(hx - 12, hy - 12, 2.5, 7); }
  else if (o.hat === 'brodie') { ctx.fillStyle = '#4c5a3c'; ctx.beginPath(); ctx.ellipse(hx, hy - 5, 11, 4.5, 0, Math.PI, 0); ctx.fill(); }

    if (T > 1.6 && T < 3.6) { const a = fade(T, 1.6, 3.6, .3); ctx.save(); ctx.globalAlpha = a; ctx.translate(760 - (T - 1.6) * 120, 250); ctx.rotate(-.06);
      ctx.font = '900 54px Impact, system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.lineWidth = 6; ctx.strokeStyle = '#111'; ctx.strokeText('ALLAH ALLAH!', 0, 0); ctx.fillStyle = '#ffd23f'; ctx.fillText('ALLAH ALLAH!', 0, 0); ctx.restore(); }
    label('57. Alay', 1170, this.g(1170) - 105, { a: fade(T, .9, 1.9), size: 15, bg: 'rgba(227,10,23,.85)' });
  } },
// 5) Evacuation
{ a: 16, b: 18, date: 'Ocak 1916', cap: 'İtilaf kuvvetleri geceleyin gizlice çekiliyor. Boğaz geçilemedi!',
  update(T, dt) { for (let i = 0; i < 3; i++) smokeFrom(640 + i * 240 - T * 200 + 20, WL - 82 * .8, 10, dt, '#2a2d38'); },
  draw(T) {
    sky(['#03050c', '#0c1328', '#1d2547'], SEAY); stars(1, T);
    ctx.fillStyle = '#f2eed8'; circle(220, 120, 34); ctx.fillStyle = '#0c1328'; circle(234, 112, 30);
    hills(SEAY, '#0a0d1c', 7, 24, 120);
    const sg = seaGrad(SEAY, '#101b33', '#02050c'); sea(SEAY, SEAY, sg, T, 'rgba(160,190,255,.22)');
    for (let i = 0; i < 3; i++) ship(640 + i * 240 - T * 200, WL - i * 4, .8 - i * .06, -1, { dark: true, lights: true });
    sea(WL, WL + 2, sg, T, 'rgba(160,190,255,.22)');
    cliff('#05060c', '#10131f');
    stick({ x: 1200, y: 384, face: -1, hat: 'kabalak', col: '#000', aim: .05 });
    flag(1240, 290, 40, 27, T, 1);
  } },
// 6) Finale
{ a: 18, b: END, date: null,
  update(T) { at(T, 0, 'pad', pad); },
  draw(T) {
    sky(['#2b1b3d', '#9e3a3a', '#f39a4a', '#ffd38a'], 560);
    sun(W / 2, 560, 70 + T * 4, '#fff1c4', 'rgba(255,200,120,.75)');
    hills(600, '#3a1f22', 21, 30, 100);
    // Şehitler Abidesi
    const ax = W / 2, ay = 575; ctx.fillStyle = '#1a0f12';
    [-58, -26, 10, 42].forEach((dx, i) => ctx.fillRect(ax + dx, ay - 100, i % 3 ? 14 : 18, 100)); ctx.fillRect(ax - 70, ay - 118, 140, 20);
    ctx.fillStyle = '#1a0f12'; ctx.beginPath(); ctx.moveTo(0, H); ctx.lineTo(0, 620); ctx.quadraticCurveTo(W / 2, 545, W, 620); ctx.lineTo(W, H); ctx.fill();
    const a = clamp(T / .8);
    ctx.globalAlpha = a; flag(W / 2 - 160, 40 + (1 - a) * 30, 330, 220, T, 1.1, true, 225); ctx.globalAlpha = 1;
    const b = clamp((T - .5) / .8);
    ctx.globalAlpha = b; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `900 ${70 + (1 - b) * 20}px Georgia, serif`; ctx.lineWidth = 8; ctx.strokeStyle = 'rgba(30,5,8,.8)'; ctx.strokeText('ÇANAKKALE GEÇİLMEZ', W / 2, 355);
    ctx.fillStyle = '#fff8ea'; ctx.fillText('ÇANAKKALE GEÇİLMEZ', W / 2, 355);
    ctx.globalAlpha = clamp((T - 1.2) / .8); ctx.font = 'italic 24px Georgia, serif'; ctx.fillStyle = '#fff2dc';
    ctx.fillText('18 Mart 1915 · Tüm şehitlerimizi rahmet ve saygıyla anıyoruz', W / 2, 412); ctx.globalAlpha = 1;
  } },
];

// ---------- main loop ----------
let t = 0, running = false, cur = -1, last = 0;
function reset() { t = 0; cur = -1; P = []; tracers = []; fired = new Set(); shake = flash = 0; R = mulberry32(1915); scenes.forEach(s => s.init && s.init()); }
function step(dt) {
  t = Math.min(END, t + dt);
  const idx = scenes.findIndex(s => t >= s.a && t < s.b); const i = idx < 0 ? scenes.length - 1 : idx;
  if (i !== cur) { cur = i; P = []; tracers = []; }
  const s = scenes[cur]; s.update && s.update(t - s.a, dt); stepFx(dt);
}
function render() {
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  const s = scenes[Math.max(0, cur)], T = t - s.a;
  ctx.save(); if (shake > .3) ctx.translate((R() - .5) * shake, (R() - .5) * shake);
  ctx.fillStyle = '#000'; ctx.fillRect(-20, -20, W + 40, H + 40);
  s.draw(T); drawFx(); ctx.restore();
  if (flash > .01) { ctx.fillStyle = `rgba(255,245,220,${flash})`; ctx.fillRect(0, 0, W, H); }
  // caption
  if (s.date) {
    const a = fade(T, .25, s.b - s.a - .1, .3), off = (1 - a) * 30;
    ctx.globalAlpha = a; ctx.font = '600 23px system-ui, sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    const tw = ctx.measureText(s.cap).width; ctx.font = '800 18px system-ui, sans-serif'; const dw = ctx.measureText(s.date).width + 28;
    const bw = Math.min(W - 40, tw + dw + 44), bx = (W - bw) / 2, by = H - 78 + off;
    ctx.fillStyle = 'rgba(8,8,12,.72)'; roundRect(bx, by, bw, 50, 25); ctx.fill();
    ctx.fillStyle = '#e30a17'; roundRect(bx + 8, by + 8, dw, 34, 17); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.fillText(s.date, bx + 22, by + 26);
    ctx.font = '600 23px system-ui, sans-serif'; ctx.fillStyle = '#f4efe6'; ctx.fillText(s.cap, bx + dw + 22, by + 26, bw - dw - 34);
    ctx.globalAlpha = 1;
  }
  // scene transitions
  let fa = clamp(1 - t / .5);
  for (const sc of scenes.slice(1)) fa = Math.max(fa, clamp(1 - Math.abs(t - sc.a) / .22));
  if (fa > 0) { ctx.fillStyle = `rgba(0,0,0,${fa})`; ctx.fillRect(0, 0, W, H); }
  ctx.fillStyle = 'rgba(255,255,255,.15)'; ctx.fillRect(0, H - 5, W, 5); ctx.fillStyle = '#e30a17'; ctx.fillRect(0, H - 5, W * t / END, 5);
}
function loop(now) {
  if (!running) return;
  const dt = clamp((now - last) / 1000 || 0, 0, .05); last = now;
  step(dt); render();
  if (t >= END) { running = false; document.getElementById('end').classList.remove('hidden'); return; }
  requestAnimationFrame(loop);
}
function play() {
  resize(); try { initAudio(); } catch (e) {} reset(); running = true; last = performance.now();
  document.getElementById('start').classList.add('hidden'); document.getElementById('end').classList.add('hidden');
  requestAnimationFrame(loop);
}
document.getElementById('playBtn').onclick = play;
document.getElementById('replayBtn').onclick = play;
const muteBtn = document.getElementById('mute');
muteBtn.onclick = () => { muted = !muted; muteBtn.textContent = muted ? '🔇' : '🔊'; };
// static first frame behind the start screen
reset(); step(1.6); render(); reset();
// test hook: render frame at time x
window.__seek = x => { silent = true; reset(); while (t < x - 1e-6) step(Math.min(1 / 60, x - t)); render(); silent = false; };
})();
</script>
